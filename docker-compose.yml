services:
  mongo:
    image: mongo:latest
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - ./.db-mongodb:/data/db:delegated

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backend
    ports:
      - 8008:8080
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_SECURITY_USER_NAME=user1
      - SPRING_SECURITY_USER_PASSWORD=123456
    depends_on:
      - mongo

  ai-service:
    build: 
      context: ./ai-service
    ports:
      - 8000:8000
    volumes:
      - ./ai-service:/app
      - shared-media:/app/shared_data
    environment:
      - MONGODB_URI=mongodb://mongo:27017/senior_capstone
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=course_materials
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      - qdrant
      - mongo

  qdrant:
    image: qdrant/qdrant
    ports:
      - 6333:6333
      - 6334:6334
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant-data:/qdrant/storage

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    working_dir: /frontend
    environment:
      - MONGODB_URI=mongodb://admin:admin@mongo:27017/senior_project?authSource=admin
    volumes:
      - shared-media:/frontend/public
    command: npm start
    depends_on:
      - backend

  frontend-dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      target: frontend
    volumes:
      - .:/workspaces/senior-capstone-project
      - ./.devcontainer/frontend/.vscode:/workspaces/senior-capstone-project/.vscode
      - ~/.ssh:/home/senior/.ssh:cached
      - ~/.config:/home/senior/.config:cached
    ports:
      - 3000:3000
    command: sleep infinity
    depends_on:
      - backend
      - mongo

  backend-dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      target: backend
    volumes:
      - .:/workspaces/senior-capstone-project
      - ./.devcontainer/backend/.vscode:/workspaces/senior-capstone-project/.vscode
    ports:
      - 8080:8080
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_SECURITY_USER_NAME=user1
      - SPRING_SECURITY_USER_PASSWORD=123456
    command: sleep infinity
    depends_on:
      - mongo

volumes:
  mongo-data:
  qdrant-data:
  shared-media: